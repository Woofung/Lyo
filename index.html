e notified.</small></section>`:''}</div><aside class="panel chat"><div class="chat-top row between"><div><h3 style="margin:0">The huddle</h3><small>Activity group chat · Free</small></div>${icon('chat')}</div><div class="chat-messages">${p||host?e.messages.map(m=>`<div class="message ${m.id===S.user?'mine':''}"><small>${esc(user(m.id)?.name||'Host')}</small><div class="bubble">${esc(m.text)}</div></div>`).join(''):`<div class="empty"><h3>Meet your teammates.</h3><p>Join this activity to read and take part in the group conversation.</p></div>`}</div>${p||host?`<form id="chat-form"><input name="message" aria-label="Message the group" placeholder="Message the group…" required maxlength="1000"><button class="btn" aria-label="Send message">${icon('send')}</button></form>`:`<div class="notice">Only registered participants can access this chat.</div>`}</aside></div>${e.status==='open'&&S.now<Date.parse(e.start)?`<div class="joinbar">${p?`<span class="pill orange">Joined as ${p.role}</span><button class="btn secondary" data-action="change-role">Change role</button><button class="textbtn" data-action="leave">Cancel my spot</button>`:`<select id="join-role" aria-label="Participation role">${['Player','Waitlist','Reserve','Spectator','Referee'].map(r=>`<option>${r}</option>`).join('')}</select><button class="btn" data-action="join">Join activity ${icon('arrow')}</button>`}</div>`:''}`}
function rate(id){const entries=S.events.filter(e=>e.status==='completed').map(e=>({e,p:membership(e,id)})).filter(x=>x.p&&!['Spectator','Waitlist'].includes(x.p.role)&&['Present','Absent'].includes(x.p.attendance)&&!S.ledger.some(l=>l.event===x.e.id&&l.user===id&&['pending','disputed','unverified'].includes(l.state))).map(x=>({event:x.e.id,at:Date.parse(x.e.start),present:x.p.attendance==='Present'}));S.ledger.filter(l=>l.user===id&&l.type==='late'&&S.events.find(e=>e.id===l.event)?.status==='completed').forEach(l=>{if(!entries.some(x=>x.event===l.event))entries.push({at:Date.parse(S.events.find(e=>e.id===l.event).start),present:false})});const recent=entries.sort((a,b)=>b.at-a.at).slice(0,5);return recent.length?`${recent.filter(x=>x.present).length} / ${recent.length}`:'—'}
function settings(){if(!user())return `<div class="empty"><h2>Make yourself at home.</h2><button class="btn" data-action="auth">Sign in to personalize Lyo</button></div>`;const u=user();return `<h1>Your corner.</h1><p class="muted" style="margin:8px 0 24px">A few things that make Lyo yours.</p><div class="stack"><section class="panel"><div class="row between"><div class="row">${avatar(u.id,true)}<div><h2>${esc(u.name)}</h2><p class="muted">${u.age} · ${esc(u.gender||'Not disclosed')}</p><small>@${esc(u.id)}</small></div></div><button class="btn secondary small" data-action="profile">Edit profile</button></div><hr class="divider"><div class="scorecard"><div><span class="big-score">${u.score}</span><small style="display:block">Integrity score</small></div><div><h2>${rate(u.id)}</h2><small>Recent attendance · Last 5 eligible activities</small><br><button class="textbtn" data-action="score-history">Score history & appeals →</button></div></div></section><section class="panel"><h3>Privacy & preferences</h3><div class="settings-row"><div><b>Private-message requests</b><br><small>Decide who gets to start a conversation. No phone sharing.</small></div><select id="privacy-setting" aria-label="Private-message requests"><option value="ask" ${u.privacy==='ask'?'selected':''}>Accept requests; ask me each time</option><option value="off" ${u.privacy==='off'?'selected':''}>Do not accept requests</option></select></div><div class="settings-row"><div><b>Distance units</b><br><small>Discovery radius follows your selected units.</small></div><select id="unit-setting" aria-label="Distance units"><option value="mi" ${S.units==='mi'?'selected':''}>Miles</option><option value="km" ${S.units==='km'?'selected':''}>Kilometers</option></select></div><div class="settings-row"><div><b>Language</b><br><small>English in this first edition.</small></div><span class="pill">English</span></div><small>Planned: 繁體中文 · 简体中文 · 日本語 · 한국어 · Français · Português · Español</small></section><section class="p hat for US$1</button>`:r?`<button class="btn secondary" ${r.status==='blocked'?'disabled':''} data-action="request-status" data-id="${r.id}">${{pending:'Request pending',approved:'Accepted · Awaiting their payment',rejected:'Request declined',blocked:'Connection blocked'}[r.status]}</button>`:`<button class="btn secondary" data-action="request" data-id="${id}">${icon('chat')}Request private chat · US$1</button>`}</section>`}).join('')}</div>`:`<div class="empty"><h3>New faces are waiting.</h3><p>People appear here after you both attend an activity.</p><button class="btn" data-action="nav" data-page="home">Find an activity</button></div>`}`}

ed</option></select></div><div class="full"><label>Profile picture</label><div class="row"><select name="avatar" aria-label="Cartoon avatar"><option value="🍊">🍊 Orange</option><option value="🐻">🐻 Bear</option><option value="🐱">🐱 Cat</option><option value="🦊">🦊 Fox</option></select><input type="file" id="reg-photo" accept="image/*" aria-label="Upload a profile picture"></div><label style="margin-top:10px">Or take a photo on your phone</label><input type="file" id="reg-camera" accept="image/*" capture="user" aria-label="Take a profile picture"></div><div class="full"><label>Private-message requests · Choose one</label><label class="check choice"><input type="radio" name="privacy" value="ask" required>Accept requests; ask me each time</label><label class="check choice"><input type="radio" name="privacy" value="off" required>Do not accept requests</label><small>You can change this later. We never share your registration phone.</small></div><div class="full"><label class="check"><input type="checkbox" name="terms" required>I agree to the prototype’s community guidelines and understand this is a local demo.</label><button class="textbtn" type="button" data-action="terms">Read community guidelines</button></div></div><div class="error" id="auth-error" role="alert"></div><button class="btn">Create demo account ${icon('arrow')}</button></form><div class="guest"><button class="textbtn" data-action="login-mode">Already have an account? Sign in</button></div>`:`<span class="eyebrow muted">Welcome to Lyo</span><h2 style="margin-top:12px">Your next game starts here.</h2><p>Sign in and find your kind of together.</p><form id="login-form"><div><label for="login-email">Email</label><input type="email" id="login-email" name="email" value="alex@example.test" required autocomplete="username"></div><div><label for="login-password">Password</label><input id="login-password" type="password" name="password" placeholder="Any password for this demo" required autocomplete="current-password">< function create(sport='Volleyball'){if(!requireUser())return;V.createPin=[56,44];const local=fmt(S.now+86400000,CITIES[S.city].zone,{year:'numeric',month:'2-digit',day:'2-digit'});const defaultDate=datePart(S.now+86400000,CITIES[S.city].zone)+'T15:00';V.page='create';V.detail=null;$('#app').innerHTML=shell(`<button class="textbtn row" data-action="nav" data-page="home">${icon('back')}Back to discover</button><h1 style="margin:18px 0 8px">Be the reason it happens.</h1><p class="muted" style="margin-bottom:23px">A few details. A new group of people.</p><form id="create-form" class="panel"><div class="form-grid"><div><label for="event-sport">Activity</label><select id="event-sport" name="sport">${SPORTS.map(s=>`<option ${s===sport?'selected':''}>${s}</option>`).join('')}</select></div><div><label for="event-title">Activity title</label><input id="event-title" name="title" required maxlength="90" placeholder="Give your gathering a name"></div><div class="full"><label for="event-subtitle">Subtitle · Optional</label><input id="event-subtitle" name="subtitle" maxlength="100" placeholder="Game names, format, or a little extra detail"></div><div><label for="event-city">City / time zone</label><select id="event-city" name="city">${Object.keys(CITIES).map(c=>`<option ${S.city===c?'selected':''}>${c}</option>`).join('')}</select></div><div><label for="event-start">Start · Local to selected city</label><input id="event-start" type="datetime-local" name="start" value="${defaultDate}" required><small>Demo clock: ${fmt(S.now,CITIES[S.city].zone,{dateStyle:'medium',timeStyle:'short'})}</small></div><div><label for="event-duration">Duration · Hours</label><input id="event-duration" type="number" name="duration" min="0.5" max="24" step="0.5" value="2" required></div><div><label for="event-location">Venue & exact meeting instructions</label><input id="event-location" name="location" required maxlength="160" placeholder="Park name · East gate, Court 2"></div><div class="full"><label>Tap ">Your role as host</label><select id="host-role" name="role">${['Player','Waitlist','Reserve','Spectator','Referee'].map(r=>`<option>${r}</option>`).join('')}</select></div><div><label for="host-skill">Your self-rated skill for this activity</label><select id="host-skill" name="hostSkill">${LEVELS.map(l=>`<option>${l}</option>`).join('')}</select></div><div class="full"><label for="event-note">The plan & payment instructions</label><textarea id="event-note" name="note" required maxlength="2000" placeholder="What should people know? How should they pay at the venue?"></textarea></div><div class="full notice">With a minimum: create at least 2 hours before the start. Same-day activities are checked 1 hour before the start; earlier activities are also checked at midnight. With no minimum: create any time before the start. Hosts cannot earn points from their own activities.</div></div><div class="error" id="create-error" role="alert"></div><div class="form-actions"><button type="button" class="btn secondary" data-action="nav" data-page="home">Cancel</button><button class="btn">Publish activity ${icon('arrow')}</button></div></form>`);window.scrollTo(0,0)}
function activeEvent(){return S.events.find(e=>e.id===V.detail)}
function ledgerEntry(e,id,type,delta,state='confirmed'){if(S.ledger.some(l=>l.event===e.id&&l.user===id&&l.delta<0))return;const l={id:'l'+Date.now()+Math.random().toString(36).slice(2,6),event:e.id,user:id,type,delta,state,at:S.now,day:datePart(e.start,e.zone)};S.ledger.push(l);if(state==='confirmed')user(id).score+=delta;notify(e,`${user(id).name}: ${type==='late'?'same-day withdrawal (−3)':type==='no-show'?'absence marked; 48 hours to dispute before −5 is applied':'attendance confirmed (+1)'}.`,[id]);return l}
function lateWithdrawal(e,id){if(e.status!=='open'||datePart(S.now,e.zone)!==datePart(e.start,e.zone))return;ledgerEntry(e,id,'late',-1)}
function refundCancelledPenalties(e){for(const l of S.ledger.filter(l=>l.event===e.id&&l.delta<0&&!['void','unverified'].includes(l.state))){if(l.state==='confirmed')user(l.user).score-=l.delta;l.state='void'}}
const baseCancelEvent=cancelEvent;
cancelEvent=function(e,reason){baseCancelEvent(e,reason);refundCancelledPenalties(e)};
function joinDialog(){if(!requireUser())return;const e=activeEvent();if(!e||e.status!=='open'||S.now>=Date.parse(e.start))return toast('This activity is no longer accepting registrations.');const role=$('#join-role')?.value||'Player';if(user().score<e.threshold)return toast(`This activity requires an integrity score of ${e.threshold}. Yours is ${user().score}.`);V.joinRole=role;modal(role==='Spectator'?'Come cheer them on.':role==='Referee'?'Help keep the game moving.':'Save your place.',`<form id="join-form" class="stack"><p><b>${esc(e.title)}</b><br>${when(e)}</p>${['Player','Reserve','Waitlist'].includes(role)?`<div><label for="join-skill">Your ${e.sport} skill · Self-rated</label><select id="join-skill" name="skill">${LEVELS.map(l=>`<option ${l===(user().skills[e.sport]||'Beginner')?'selected':''}>${l}</option>`).join('')}</select><small>Required: ${e.skill==='Any'?'All levels':e.skill+' & above'}</small></div>`:''}<div class="notice">${role==='Player'&&e.cap&&players(e).length>=e.cap?'Player spots are full. You will join the waitlist with no attendance obligation. ':''}${role==='Spectator'?'Spectators do not affect minimum player count or integrity points.':'Players, reserves and referees commit to attending. Same-day withdrawal −1; confirmed no-show −10.'}</div><p class="muted">${fee(e)}${e.entry?'<br>Admission for everyone: '+money(e.entry,e):''}</p><div class="error" id="join-error" role="alert"></div><button class="btn">Confirm ${role==='Player'?'registration':role.toLowerCase()+' spot'}</button></form>`)}
function roleDialog(){const e=activeEvent(),p=membership(e);modal('Change your role',`<form id="role-form" class="stack"><p>Your current role: <b>${p.role}</b></p><div><label for="new-role">New role</label><select id="new-role" name="role">${['Player','Waitlist','Reserve','Spectator','Referee'].map(r=>`<option ${r===p.role?'selected':''}>${r}</option>`).join('')}</select></div><div class="notice">Reserves automatically move into open player spots. Switching to spectator on the event day counts as a same-day withdrawal (−3). Skill requirements apply to players and reserves.</div><div class="error" id="role-error" role="alert"></div><button class="btn">Save role</button></form>`)}
function awardAttendance(e){const count=e.participants.filter(p=>p.self&&p.attendance==='Present').length;if(count<2)return;for(const p of e.participants){if((p.id===e.host||e.organizers?.includes(p.id))||['Spectator','Waitlist'].includes(p.role)||!p.self||p.attendance!=='Present'||S.ledger.some(l=>l.event===e.id&&l.user===p.id&&l.state!=='corrected'))continue;const day=datePart(e.start,e.zone);if(S.ledger.some(l=>l.user===p.id&&l.delta>0&&l.day===day&&l.state==='confirmed'))continue;ledgerEntry(e,p.id,'attendance',1)}}
function attendanceDialog(){const e=activeEvent();if(e.host!==S.user||e.status!=='completed')return;modal('Confirm who came.',`<p class="muted">Only attendance is editable. The system calculates points. Self-confirmation plus host confirmation is required for a positive score.</p><div class="stack">${e.participants.filter(p=>!['Spectator','Waitlist'].includes(p.role)&&p.id!==e.host).map(p=>`<div class="person-row">${avatar(p.id)}<div class="grow"><b>${esc(user(p.id).name)}</b><small>${p.role} · ${p.self?'Self-confirmed':'Not self-confirmed'} · ${p.attendance||'Unmarked'}</small></div><button class="btn small secondary" data-action="mark-attendance" data-id="${p.id}" data-value="Present" ${p.attendance?'disabled':''}>Present</button><button class="textbtn" data-action="mark-attendance" data-id="${p.id}" data-value="Absent" ${p.attendance?'disabled':''}>Absent</button></div>`).join('')}</div><p class="field-help">Already-marked attendance can be corrected through the appeal review flow. Hosts cannot mark themselves for points.</p>`)}
function history(){const entries=S.ledger.filter(l=>l.user===S.user).slice().reverse();modal('Your integrity history',`<div class="notice" style="margin-bottom:16px">Starts at 100. Attendance +1 (max once per day); same-day withdrawal −3; no-show −10 after a 48-hour dispute window. Cancelled activities do not penalize you.</div>${entries.length?entries.map(l=>`<div class="notification"><div class="row between"><b>${l.delta>0?'+':''}${l.delta} · ${esc(l.type)}</b><span class="pill">${l.state}</span></div><p>${esc(S.events.find(e=>e.id===l.event)?.title)}</p>${l.state==='pending'&&S.now<l.at+48*3600000?`<button class="textbtn" data-action="appeal" data-id="${l.id}">Dispute attendance →</button>`:''}${l.reason?`<small>Your statement: ${esc(l.reason)}</small>`:''}</div>`).join(''):`<div class="empty">No score changes yet. Your sample past activity is history only.</div>`}`)}
function admin(){modal('Attendance review · Demo admin',`<p class="notice">This simulates a human review. No automated verification is claimed. Switch to the host to review a submitted dispute first; unresolved cases can be resolved here.</p>${S.ledger.filter(l=>l.state==='disputed').map(l=>`<div class="notification"><b>${esc(user(l.user).name)} · ${esc(S.events.find(e=>e.id===l.event)?.title)}</b><p>${esc(l.reason)}</p><small>Recorded attendance: ${esc(membership(S.events.find(e=>e.id===l.event),l.user)?.attendance)}</small><div class="row wrap" style="margin-top:10px"><button class="btn small secondary" data-action="resolve" data-id="${l.id}" data-value="present">Correct to present</button><button class="btn small secondary" data-action="resolve" data-id="${l.id}" data-value="absent">Confirm absence</button><button class="btn small secondary" data-action="resolve" data-id="${l.id}" data-value="unknown">Insufficient evidence</button></div></div>`).join('')||'<div class="empty">No disputed attendance to review.</div>'}`)}
function requestChat(id){if(!requireUser())return;if(!common(id).length)return toast('You must both attend a shared activity first.');if(user(id).privacy!=='ask')return modal('Requests are turned off.',`<p>${esc(user(id).name)} does not accept private-message requests. No request was sent and you have not been charged.</p><button class="btn secondary" data-action="close">Got it</button>`);modal('Say hello again.',`<div class="row" style="margin-bottom:18px">${avatar(id,true)}<div><h3>${esc(user(id).name)}</h3><small>${esc(common(id)[0].subtitle)}</small></div></div><p>They will see your photo, nickname, ID and shared activity before deciding.</p><div class="notice">US$1 only after approval. One payment opens a two-way conversation. No phone number is shared.</div><div class="form-actions"><button class="btn" data-action="send-request" data-id="${id}">Send request · No charge yet</button></div>`)}
function dm(id){const r=S.requests.find(r=>r.id===id);if(!r||r.status!=='paid'||![r.from,r.to].includes(S.user))return;V.dm=id;const other=r.from===S.user?r.to:r.from;modal(`Chat with ${esc(user(other).name)}`,`<div class="row between"><small>Connection unlocked · No further message fees</small><button class="textbtn" data-action="block" data-id="${id}">Block / report</button></div><div class="chat-messages" style="height:260px">${r.messages.length?r.messages.map(m=>`<div class="message ${m.id===S.user?'mine':''}"><small>${esc(user(m.id).name)}</small><div class="bubble">${esc(m.text)}</div></div>`).join(''):'<div class="empty">A good game deserves a follow-up. Say hello.</div>'}</div><form id="dm-form" class="row"><input name="message" aria-label="Private message" required maxlength="1000" placeholder="Write a message…"><button class="btn" aria-label="Send private message">${icon('send')}</button></form>`)}
function profile(){const u=user();modal('Edit your profile',`<form id="profile-form" class="stack"><div><label for="profile-name">Nickname</label><input id="profile-name" name="name" value="${esc(u.name)}" required maxlength="40"></div><div><label for="profile-age">Age</label><input id="profile-age" name="age" type="number" min="18" max="120" value="${u.age}" required></div><div><label for="profile-gender">Gender</label><select id="profile-gender" name="gender">${['Male','Female','Not disclosed'].map(g=>`<option ${u.gender===g?'selected':''}>${g}</option>`).join('')}</select></div><div><label for="profile-photo">New profile photo</label><input id="profile-photo" name="photo" type="file" accept="image/*"></div><button class="btn">Save profile</button></form>`)}
async function photoData(file){if(!file)return null;if(!file.type.startsWith('image/'))throw Error('Please choose an image.');if(file.size>5000000)throw Error('Please choose an image smaller than 5 MB.');return new Promise((resolve,reject)=>{const rd=new FileReader();rd.onerror=()=>reject(Error('Could not read image.'));rd.onload=()=>{const img=new Image();img.onerror=()=>reject(Error('This image format is not supported. Please try JPEG or PNG.'));img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=160;const ctx=c.getContext('2d'),side=Math.min(img.width,img.height);ctx.drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,160,160);resolve(c.toDataURL('image/jpeg',.8))};img.src=rd.result};rd.readAsDataURL(file)})}
function login(id){S.user=id;save();V.auth='login';nav('home');toast('Welcome, '+user().name.split(' ')[0]+'. Your next game is waiting.')}
document.addEventListener('click',event=>{const b=event.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id,value=b.dataset.value,e=activeEvent();
 if(a==='close')closeModal();
 else if(a==='nav')nav(b.dataset.page);
 else if(a==='auth'){closeModal();V.page='auth';V.auth='login';render()}

 else if(a==='register-mode'){V.auth='register';render();modal('Before we get started',termsHTML+'<div class="form-actions"><button class="btn" data-action="close">Continue to registration</button></div>')}

 else if(a==='social'){modal(`${esc(value)} sign-in · Demo`, `<p>This simulates the return from ${esc(value)}. No external account is accessed.</p><button class="btn" data-action="social-continue">Continue as Alex</button>`)}
 else if(a==='social-continue'){closeModal();login('alex')}

 else if(a==='detail'){V.detail=id;V.detailTab='info';render();window.scrollTo(0,0)}

 else if(a==='filters')filters();
 else if(a==='demo-location'){$('#city').value='San Francisco';toast('Demo location set to San Francisco.')}
 else if(a==='activity-tab'){V.tab=value;render()}
 else if(a==='create')create(b.dataset.sport);
 else if(a==='join')joinDialog();
 else if(a==='change-role')roleDialog();
 else if(a==='leave'){modal('Cancel your spot?',`<p>${esc(e.title)}</p><div class="notice">${datePart(S.now,e.zone)===datePart(e.start,e.zone)&&!['Spectator','Waitlist'].includes(membership(e).role)?'This is a same-day withdrawal (−3).':'No integrity penalty for this cancellation.'} Any eligible reserve will move into your spot.</div><div class="form-actions"><button class="btn secondary" data-action="close">Keep my spot</button><button class="btn danger" data-action="confirm-leave">Cancel my spot</button></div>`)}
 else if(a==='confirm-leave'){const p=membership(e);if(!['Spectator','Waitlist'].includes(p.role))lateWithdrawal(e,S.user);e.participants=e.participants.filter(p=>p.id!==S.user);notify(e,user().name+' withdrew from the activity.',[S.user]);promote(e);closeModal();render();toast('Your spot has been cancelled.')}
 else if(a==='cancel-host'){modal('Cancel this activity',`<form id="cancel-form" class="stack"><p>All registered players, reserves, spectators and referees will be notified. Withdrawal penalties already incurred remain; other participants receive no attendance penalty.</p><div><label for="cancel-reason">Reason · Required</label><textarea id="cancel-reason" name="reason" required minlength="5" maxlength="600" placeholder="Let everyone know what happened…"></textarea></div><button class="btn danger">Cancel activity & notify everyone</button></form>`)}
 else if(a==='self-attend'){const p=membership(e);p.self=true;if(S.user===e.host)p.attendance='Present';awardAttendance(e);save();render();toast('Attendance submitted to your host.')}
 else if(a==='attendance')attendanceDialog();
 else if(a==='mark-attendance'){if(e.host!==S.user||e.status!=='completed'||id===e.host)return;const p=membership(e,id);if(p.attendance)return;p.attendance=value;if(value==='Absent')ledgerEntry(e,id,'no-show',-5,'pending');else awardAttendance(e);save();attendanceDialog();render()}
 else if(a==='score-history')history();
 else if(a==='appeal'){V.appeal=id;modal('Dispute attendance',`<form id="appeal-form" class="stack"><p>Explain what happened. Include details from the group chat or an on-site check-in that a person can review.</p><textarea name="reason" aria-label="Your attendance statement" required minlength="10" maxlength="2000" placeholder="I arrived at…"></textarea><button class="btn">Submit appeal</button></form>`)}
 else if(a==='admin')admin();
 else if(a==='resolve'){const l=S.ledger.find(l=>l.id===id);if(!l||l.state!=='disputed')return;const ev=S.events.find(e=>e.id===l.event),p=membership(ev,l.user);if(value==='absent'){l.state='confirmed';user(l.user).score-=5;p.attendance='Absent'}else if(value==='present'){l.state='corrected';l.delta=0;p.attendance='Present';p.self=true;awardAttendance(ev)}else{l.state='unverified';p.attendance='Unverified'}S.notifications.unshift({id:l.user,at:S.now,text:'Your attendance appeal was reviewed: '+(value==='unknown'?'insufficient evidence; no points changed':value)+'.',event:ev.id});save();admin();render()}
 else if(a==='request')requestChat(id);
 else if(a==='send-request'){if(user(id).privacy!=='ask'||pairRequest(id))return;S.requests.push({id:'r'+Date.now(),from:S.user,to:id,status:'pending',messages:[]});S.notifications.unshift({id,at:S.now,text:user().name+' requested a private conversation. Review it in Friends.'});closeModal();save();render();toast('Request sent. No payment has been taken.')}
 else if(a==='accept-request'||a==='reject-request'){const r=S.requests.find(r=>r.id===id);if(r.to!==S.user||r.status!=='pending')return;r.status=a==='accept-request'?'approved':'rejected';S.notifications.unshift({id:r.from,at:S.now,text:user().name+(r.status==='approved'?' approved your request. Complete the US$1 demo payment in Friends.':' declined your request. You have not been charged.')});save();render();toast(r.status==='approved'?'Accepted. They can now complete payment.':'Request declined. No charge.')}
 else if(a==='request-status'){const r=S.requests.find(r=>r.id===id);modal('Connection request',`<p>Status: <b>${esc(r.status)}</b>. No payment has been taken.</p>${r.from===S.user&&['pending','approved'].includes(r.status)?`<button class="btn secondary" data-action="withdraw-request" data-id="${r.id}">Withdraw request</button>`:r.to===S.user&&r.status==='approved'?`<button class="btn secondary" data-action="withdraw-request" data-id="${r.id}">Withdraw approval</button>`:''}`)}
 else if(a==='withdraw-request'){const r=S.requests.find(r=>r.id===id);if(r&&['pending','approved'].includes(r.status)&&[r.from,r.to].includes(S.user))r.status='rejected';save();closeModal();render()}
 else if(a==='pay'){const r=S.requests.find(r=>r.id===id);modal('Open your conversation',`<p>${esc(user(r.to).name)} accepted your request.</p><div class="panel row between"><b>One-time private-chat unlock</b><h2>US$1</h2></div><p class="muted" style="margin-top:15px">Both of you can message after this payment. No phone number is included. A reply is never guaranteed.</p><div class="notice">Simulated payment. No card details, no real charge.</div><div class="form-actions"><button class="btn" data-action="confirm-pay" data-id="${id}">Pay US$1 · Demo</button></div>`)}
 else if(a==='confirm-pay'){const r=S.requests.find(r=>r.id===id);if(!r||r.from!==S.user||r.status!=='approved'||user(r.to).privacy==='off')return toast('Approval is no longer available. You were not charged.');r.status='paid';r.paidAt=S.now;save();render();dm(id);toast('Demo payment complete. Your conversation is open.')}
 else if(a==='dm')dm(id);
 else if(a==='block'){modal('Control this connection',`<p>Blocking stops private messages even after payment.</p><form id="block-form" class="stack"><input type="hidden" name="request" value="${id}"><div><label for="report-reason">Report a problem · Optional</label><textarea id="report-reason" name="reason" placeholder="Tell the moderation team what happened"></textarea></div><button class="btn danger">Block connection</button><small>Reports are recorded locally for this demo; no real moderation team is contacted.</small></form>`)}
 else if(a==='profile')profile();
 else if(a==='terms')modal('Community guidelines',termsHTML);
 else if(a==='notifications'){if(!requireUser())return;const notes=S.notifications.filter(n=>n.id===S.user);modal('Your updates',notes.length?notes.slice(0,40).map(n=>`<div class="notification">${esc(n.text)}<small>${fmt(n.at,'America/Los_Angeles',{dateStyle:'short',timeStyle:'short'})} · Demo clock</small></div>`).join(''):'<div class="empty">All caught up. Your activity updates will appear here.</div>')}
 else if(a==='offer'){modal('A perk for your next outing',`<span class="pill orange">Sample advertisement</span><h2 style="margin:18px 0">${esc(value)}</h2><p>This is an illustrative discount code. It cannot be redeemed. A live version would show a disclosed partner link here.</p><button class="btn secondary" data-action="close">Back to perks</button>`)}
 else if(a==='demo')demoPanel();
 else if(a==='advance'){S.now+=Number(b.dataset.hours)*3600000;tick();render();demoPanel();toast('Clock advanced. Attendance and cancellation rules checked.')}
 else if(a==='reset-confirm'){modal('Reset this demo?',`<p>This removes local demo accounts, messages, activities and score changes, and restores the sample data.</p><button class="btn danger" data-action="reset">Reset demo data</button>`)}
 else if(a==='reset'){S=initState();V={page:'auth',auth:'login',tab:'Booked',filter:'All',search:'',detail:null,detailTab:'info'};save();closeModal();render();toast('Demo reset.')}
});
document.addEventListener('change',ev=>{const el=ev.target;if(el.id==='demo-user'){S.user=el.value||null;save();nav('home');closeModal();toast(S.user?'Viewing as '+user().name:'Browsing as guest')}
 if(el.id==='privacy-setting'){user().privacy=el.value;if(el.value==='off')S.requests.filter(r=>r.to===S.user&&['pending','approved'].includes(r.status)).forEach(r=>r.status='rejected');save();toast('Privacy preference saved. Existing paid chats are unchanged.')}

function requestButton(id){const r=pairRequest(id);if(!r)return `<button class="btn secondary small" data-action="request" data-id="${id}">${tr('Request private chat','申請私訊')}</button>`;if(r.status==='paid')return `<button class="btn small" data-action="dm" data-id="${r.id}">${tr('Message','傳送訊息')}</button>`;if(r.status==='approved'&&r.from===S.user)return `<button class="btn small" data-action="pay" data-id="${r.id}">${tr('Open chat · US$1','開通私訊・US$1')}</button>`;return `<span class="pill">${tr({pending:'Pending',approved:'Awaiting payment',blocked:'Blocked',rejected:'Declined'}[r.status],{pending:'等待回覆',approved:'等待付款',blocked:'已封鎖',rejected:'已拒絕'}[r.status])}</span>`}
friends=function(){if(!user())return `<div class="empty"><h2>${tr('Your next friends start with a shared activity.','從一起參加的活動，認識新朋友。')}</h2><button class="btn" data-action="auth">${tr('Sign in','登入')}</button></div>`;const connections=S.requests.filter(r=>[r.from,r.to].includes(S.user));const pending=connections.filter(r=>r.status==='pending'),accepted=connections.filter(r=>['approved','paid'].includes(r.status));const history=S.events.filter(e=>e.status==='completed'&&membership(e)?.attendance==='Present').sort((a,b)=>Date.parse(b.start)-Date.parse(a.start));const card=r=>{const id=r.from===S.user?r.to:r.from;return `<section class="panel friend-card"><div class="person-row">${avatar(id)}<div class="grow"><b data-content="user">${esc(user(id).name)}</b><small>@${esc(id)}</small></div></div><p class="muted">${r.status==='pending'?r.to===S.user?tr('Would like to chat with you','想與你開通私訊'):tr('Your request is waiting for their reply','你已提出申請，等待對方回覆'):r.status==='paid'?tr('Private chat is open','已開通雙向私訊'):tr('Accepted · Payment not completed','已同意・尚未付款')}</p>${r.status==='pending'&&r.to===S.user?`<div class="row"><button class="btn small" data-action="accept-request" data-id="${r.id}">${tr('Accept','接受')}</button><button class="btn secondary small" data-action="reject-request" data-id="${r.id}">${tr('Decline','拒絕')}</button></div>`:requestButton(id)}${r.status!=='paid'?`<button class="textbtn" data-action="request-status" data-id="${r.id}">${tr('Manage request','管理申請')}</button>`:''}</section>`};return `<h1>${tr('Keep the good company.','把一起玩的緣分留下來。')}</h1><p class="muted" style="margin:10px 0 22px">${tr('Your conversations, followed by the activities that brought you together.','先看聯絡進度，再從過去活動找回熟悉的面孔。')}</p><div class="section-head"><h2>${tr('Pending requests','待處理的聯絡請求')} <small>${pending.length}</small></h2></div>${pending.length?`<div class="friend-grid">${pending.map(card).join('')}</div>`:`<div class="empty compact">${tr('No pending requests. Find someone from a past activity below.','目前沒有待處理的請求。可以從下方過去活動找到想聯絡的人。')}</div>`}<div class="section-head"><h2>${tr('Accepted connections','已接受的聯絡')} <small>${accepted.length}</small></h2></div>${accepted.length?`<div class="friend-grid">${accepted.map(card).join('')}</div>`:`<p class="muted">${tr('Accepted requests and open conversations will appear here.','已同意的申請與已開通的對話會出現在這裡。')}</p>`}<div class="section-head"><h2>${tr('Past activities','過去參加的活動')}</h2></div><div class="stack">${history.map(e=>`<button class="past-activity panel row" data-action="past-roster" data-id="${e.id}"><span class="past-art" style="background:${artColors[e.sport]}">${sportArt(e.sport)}</span><span class="grow"><small>${sportLabel(e.sport)} · ${fmt(e.start,e.zone,{month:'short',day:'numeric'})}</small><h3 data-content="demo">${esc(e.subtitle||e.title)}</h3><small>${tr('View attendees and request a chat','查看出席者並申請私訊')}</small></span>${icon('arrow')}</button>`).join('')||`<div class="empty">${tr('Your completed activities will appear here.','參加並完成活動後，紀錄會出現在這裡。')}</div>`}</div>`};
function roster(id){const e=S.events.find(e=>e.id===id);modal(tr('People you played with','一起參加活動的人'),`<h3 data-content="demo">${esc(e.subtitle)}</h3><p class="muted">${when(e)}</p>${e.participants.filter(p=>p.id!==S.user&&p.attendance==='Present').map(p=>`<div class="person-row">${avatar(p.id)}<div class="grow"><b data-content="user">${esc(user(p.id).name)}</b><small>${user(p.id).age} · ${rname(p.role)} · ${tr('Integrity','誠信分數')} ${user(p.id).score}</small></div>${requestButton(p.id)}</div>`).join('')}<p class="field-help">${tr('US$1 only after they approve. No phone sharing.','對方同意後才支付 US$1。不分享電話號碼。')}</p>`)}
function langControl(){return `<label class="language-control"><span class="sr-only">Language / 語言</span><select data-language aria-label="Language / 語言"><option value="en" ${language==='en'?'selected':''}>EN</option><option value="zh-TW" ${language==='zh-TW'?'selected':''}>繁中</option></select></label>`}
const origSettings=settings;
settings=function(){let html=origSettings();return html.replace('<span class="pill">English</span>',langControl()).replace('English in this first edition.','English and Traditional Chinese.').replace('Planned: 繁體中文 · 简体中文','Planned: 简体中文')};
const origCreate=create;
create=function(sport){origCreate(sport);const f=$('#create-form');if(!f)return;f.querySelector('.form-grid').insertAdjacentHTML('afterbegin',`<div class="full custom-name-field" ${$('#event-sport').value==='Custom activity'?'':'hidden'}><label for="custom-name">${tr('Custom activity name','自訂活動名稱')}</label><input id="custom-name" name="customName" maxlength="50" placeholder="${tr('e.g. Pickleball, hiking, running','例如：匹克球、健行、慢跑')}"></div>`);$('#host-role').closest('div').insertAdjacentHTML('beforebegin',`<div class="full"><label class="check"><input type="checkbox" name="allowReserves" id="allow-reserves">${tr('Allow on-site reserves · They commit to attending','開放現場替補・報名者承諾到場待命')}</label><small>${tr('When player spots are full, additional registrations enter the waitlist by default. Waitlisted people do not need to attend until they accept an offered spot.','正式名額滿時，預設加入候補名單。候補者確認接受名額前，不需要到場。')}</small></div>`);ensureOptionValues();$('#host-role').querySelector('option[value="Waitlist"]')?.remove();for(const o of $('#host-role').options)if(o.value==='Reserve')o.disabled=true;enhance();translatePage()};
function roleOptions(e,current='Player'){return ['Player','Waitlist',...(e.allowReserves?['Reserve']:[]),'Spectator','Referee'].map(r=>`<option value="${r}" ${r===current?'selected':''}>${rname(r)}</option>`).join('')}
joinDialog=function(){if(!requireUser())return;const e=activeEvent();if(!e||e.status!=='open'||S.now>=Date.parse(e.start))return toast(tr('Registration has closed.','報名已截止。'));if(user().score<e.threshold)return toast(tr(`Minimum integrity: ${e.threshold}. Your score: ${user().score}.`,`最低誠信分數：${e.threshold}；你的分數：${user().score}。`));modal(tr('Join this activity','加入這場活動'),`<form id="join-v2" class="stack"><h3 data-content="${e.demo?'demo':'user'}">${esc(e.title)}</h3><div><label for="v2-role">${tr('How would you like to join?','你想用哪種身分參加？')}</label><select name="role" id="v2-role">${roleOptions(e,seats(e)>0?'Player':'Waitlist')}</select></div><div id="v2-skill-field"><label for="v2-skill">${tr('Your self-rated skill','你的自評程度')}</label><select name="skill" id="v2-skill">${LEVELS.map(l=>`<option value="${l}" ${l===(user().skills[e.sport]||'Beginner')?'selected':''}>${l}</option>`).join('')}</select><small>${tr('Required: ','活動要求：')}${e.skill}</small></div><div class="notice" id="v2-role-help"></div><p>${fee(e)}${e.entry?'<br>'+tr('Admission for everyone: ','所有人另付入場費：')+money(e.entry,e):''}</p><div class="error" role="alert"></div><button class="btn">${tr('Confirm registration','確認報名')}</button></form>`);updateRoleHelp();translatePage()};
function updateRoleHelp(){const role=$('#v2-role')?.value;if(!role)return;$('#v2-skill-field').hidden=['Spectator','Referee'].includes(role);$('#v2-role-help').textContent=role==='Waitlist'?tr('No need to attend, no points gained or lost. When a spot opens, you must accept the invitation before becoming a player.','不必到場、不加分也不扣分。有名額時，必須確認接受邀請才會成為正式玩家。'):role==='Reserve'?tr('You commit to attending, even if you do not play. Automatic promotion. Attendance +1, same-day withdrawal −3, no-show −10.','即使沒有上場，也承諾到場；有空位會自動遞補。出席 +1、當天取消 −3、未到 −10。'):role==='Player'?tr('You commit to attending. If full, you join the waitlist. Attendance +1, same-day withdrawal −3, no-show −10.','你承諾到場。額滿時加入候補名單。出席 +1、當天取消 −3、未到 −10。'):role==='Spectator'?tr('Come to watch. Spectators do not earn or lose attendance points.','以觀賽為主，不計出席加減分。'):tr('Referees do not count toward the minimum but commit to attending.','裁判不計入最低玩家人數，但需要依承諾到場。')}
roleDialog=function(){const e=activeEvent(),p=membership(e);modal(tr('Change your role','變更參加身分'),`<form id="role-v2" class="stack"><label>${tr('New role','新的身分')}<select name="role">${roleOptions(e,p.role)}</select></label><div class="notice">${tr('A same-day move from a committed role to waitlist or spectator counts as a withdrawal (−3). Waitlist invitations require your confirmation; on-site reserves promote automatically.','當天從承諾到場的身分改為候補名單或觀賽，視同取消（−3）。候補名單需確認邀請，現場替補則自動遞補。')}</div><div class="error" role="alert"></div><button class="btn">${tr('Save role','儲存身分')}</button></form>`)};
function enhance(){
 ensureOptionValues();
 document.querySelectorAll('.sport-tile[data-sport="Custom activity"]').forEach(n=>n.remove());
 const top=$('.topinner');if(top&&!top.querySelector('[data-language]'))top.querySelector('.topactions').insertAdjacentHTML('afterbegin',langControl());
 const authForm=$('.auth-form');if(authForm&&!authForm.querySelector('[data-language]'))authForm.insertAdjacentHTML('afterbegin',langControl());
 const account=$('.topactions .avatar')?.closest('button');if(account){account.dataset.action='account';account.setAttribute('aria-label',tr('Account menu','帳號選單'));}
 $$('.sport-tile').forEach(tile=>{if(tile.dataset.art)return;tile.dataset.art='yes';const s=tile.dataset.sport;tile.style.background=artColors[s]||artColors['Custom activity'];tile.innerHTML=sportArt(s)+`<span>${esc(sportLabel(s))}</span>`});
 if(V.page==='home'&&!V.detail){const grids=$$('.sport-grid');if(grids.length&&!$('.custom-activity-entry'))grids.at(-1).insertAdjacentHTML('afterend',`<button class="custom-activity-entry" data-action="create" data-sport="Custom activity">${sportArt('Custom activity')}<span><b>${tr('Make it your own','自訂你想揪的活動')}</b><small>${tr('Pickleball, hiking, or something new.','匹克球、健行，或任何新點子。')}</small></span>${icon('plus')}</button>`)}
 const e=activeEvent(),heading=$('.detail-heading'),bar=$('.joinbar');
 if(e&&heading){
  heading.querySelector('.pill:not(.orange)')?.replaceChildren(document.createTextNode(statusText(e)));
  if(bar){bar.classList.add('joinbar-v2');bar.querySelector('#join-role')?.remove();heading.appendChild(bar);const p=membership(e);if(p?.role==='Waitlist'){
   bar.innerHTML=`<span class="pill orange">${rname(p.role)}</span>${p.offerUntil>S.now?`<button class="btn" data-action="accept-seat">${tr('Accept player spot','接受正式名額')}</button><button class="btn secondary" data-action="decline-seat">${tr('Decline','婉拒')}</button>`:`<span class="muted">${tr('No attendance obligation','尚無到場義務')}</span>`}<button class="textbtn" data-action="leave-v2">${tr('Leave waitlist','退出候補')}</button>`;
  }else{const join=bar.querySelector('[data-action="join"]');if(join)join.innerHTML=tr(seats(e)>0?'Join activity':'Join waitlist',seats(e)>0?'加入活動':'加入候補名單')+icon('arrow');bar.querySelector('[data-action="leave"]')?.setAttribute('data-action','leave-v2')}
  if(!p&&!heading.querySelector('.mobile-top-join'))heading.insertAdjacentHTML('beforeend',`<button class="btn mobile-top-join" data-action="join">${tr(seats(e)>0?'Join activity':'Join waitlist',seats(e)>0?'加入活動':'加入候補名單')}</button>`);
  }
  if(!heading.querySelector('.role-explainer'))heading.insertAdjacentHTML('beforeend',`<div class="role-explainer"><small>${tr('On-site reserve: must attend. Waitlist: attend only after accepting a player invitation.','現場替補：需到場待命。候補名單：確認接受正式名額後才需到場。')}</small></div>`);
  if(!e.demo){heading.querySelector('h1')?.setAttribute('data-content','user');$('.detail-info .panel>p')?.setAttribute('data-content','user')}
 }
 $$('.bubble,.avatar,.person-row b').forEach(n=>n.dataset.content='user');
 $$('.logo').forEach(n=>{n.innerHTML='Lyo<span>.</span>'});
 document.title='Lyo. — '+tr('Find people to play with.','找人一起玩。');
}
const originalRender=render;
render=function(){originalRender();enhance();translatePage()};
const originalModal=modal;
modal=function(title,body){originalModal(title,body);ensureOptionValues();translatePage()};
const originalToast=toast;
toast=function(t){originalToast(translateText(t))};
document.addEventListener('change',ev=>{
 if(ev.target.matches('[data-language]')){language=ev.target.value;try{localStorage.setItem('lyo.language',language)}catch{};if(V.page==='create'){const values=Array.from($('#create-form').elements).filter(n=>n.name).map(n=>({name:n.name,value:n.value,checked:n.checked}));const sport=$('#event-sport').value;create(sport);for(const v of values){const n=$('#create-form').elements.namedItem(v.name);if(n){n.value=v.value;if(n.type==='checkbox'||n.type==='radio')n.checked=v.checked}}$('#allow-reserves').dispatchEvent(new Event('change',{bubbles:true}));}else render();translatePage()}
 if(ev.target.id==='v2-role'){updateRoleHelp();translatePage()}
 if(ev.target.id==='event-sport'){const field=$('.custom-name-field');field.hidden=ev.target.value!=='Custom activity';$('#custom-name').required=!field.hidden;if(field.hidden)$('#custom-name').value=''}
 if(ev.target.id==='allow-reserves'){for(const o of $('#host-role').options)if(o.value==='Reserve')o.disabled=!ev.target.checked;if(!ev.target.checked&&$('#host-role').value==='Reserve')$('#host-role').value='Player'}
});
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,e=activeEvent();
 if(a==='account')modal(tr('Your account','你的帳號'),`<div class="row">${avatar(S.user,true)}<div><h3 data-content="user">${esc(user().name)}</h3><small>@${esc(S.user)}</small></div></div><div class="stack" style="margin-top:20px"><button class="btn secondary" data-action="account-settings">${tr('Profile & settings','個人資料與設定')}</button><button class="btn secondary" data-action="demo">${tr('Switch demo profile','切換示範玩家')}</button><button class="btn danger" data-action="logout">${tr('Sign out','登出')}</button></div>`);
 if(a==='account-settings'){closeModal();nav('settings')}
 if(a==='logout'){if($('#modal').open)closeModal();V.feedbackDraft=null;}
 if(a==='past-roster')roster(b.dataset.id);
 if(a==='accept-seat'){const p=membership(e);if(!p||p.role!=='Waitlist'||!p.offerUntil||p.offerUntil<=S.now||e.status!=='open'||!eligible(e,S.user)||seats(e)<=0){return toast(tr('This invitation is no longer available. No points deducted.','這個邀請已失效，不會扣分。'))}p.role='Player';delete p.offerUntil;notify(e,`${user().name} accepted a player spot.`);save();render();toast(tr('Confirmed. You are now a player and commit to attending.','已確認，你現在是正式玩家，需依約到場。'))}
 if(a==='decline-seat'){const p=membership(e);if(p?.role==='Waitlist'){delete p.offerUntil;p.offerSkipped=true;promote(e);save();render();toast(tr('Invitation declined. No points deducted.','已婉拒邀請，不扣分。'))}}
 if(a==='leave-v2'){const p=membership(e);const duty=!['Waitlist','Spectator'].includes(p.role);modal(tr('Cancel your registration?','取消你的報名？'),`<p>${duty&&datePart(S.now,e.zone)===datePart(e.start,e.zone)?tr('Same-day withdrawal: −3.','當天取消：−3 分。'):tr('No integrity penalty.','不會扣誠信分數。')}</p><button class="btn danger" data-action="confirm-leave">${tr('Confirm cancellation','確認取消')}</button>`)}
});
document.addEventListener('submit',ev=>{
 const f=ev.target;if(!['join-v2','role-v2'].includes(f.id))return;ev.preventDefault();const d=Object.fromEntries(new FormData(f)),e=activeEvent();const err=t=>f.querySelector('.error').textContent=t;
 if(!e||e.status!=='open'||S.now>=Date.parse(e.start))return err(tr('Registration is closed.','報名已截止。'));
 if(d.role==='Reserve'&&!e.allowReserves)return err(tr('On-site reserves are not enabled.','此活動未開放現場替補。'));
 if(user().score<e.threshold)return err(tr('Your integrity score is below the minimum.','你的誠信分數低於門檻。'));
 if(['Player','Reserve','Waitlist'].includes(d.role)){const skill=d.skill||user().skills[e.sport]||'Beginner';if(LEVELS.indexOf(skill)<LEVELS.indexOf(e.skill))return err(tr(`Requires ${e.skill} or above.`,`需要 ${translateText(e.skill)}以上程度。`));if(d.skill)user().skills[e.sport]=d.skill}
 const old=membership(e);if(f.id==='join-v2'&&old)return err(tr('You have already registered.','你已經報名。'));if(f.id==='role-v2'&&!old)return;
 let role=d.role;if(role==='Player'&&old?.role!=='Player'&&(old?.role==='Waitlist'||seats(e)<=e.participants.filter(p=>p.offerUntil>S.now).length))role='Waitlist';
 if(old){const before=old.role;if(!['Spectator','Waitlist'].includes(before)&&['Spectator','Waitlist'].includes(role))lateWithdrawal(e,S.user);e.roleHistory=e.roleHistory||[];e.roleHistory.push({id:S.user,from:before,to:role,at:S.now});old.role=role;if(role!=='Waitlist')delete old.offerUntil;}
 else e.participants.push({id:S.user,role});
 promote(e);notify(e,`${user().name} registered as ${membership(e)?.role||'Host'}.`);save();closeModal();render();toast(tr('Registration saved.','已儲存報名。'));
});

// Approved next-edition policy. Keep it explicitly separate from v4's running scoring engine.
const rulesBeforeApprovedTable=rulesV3;
function approvedIntegrityTable(){
 const rows=[
  [tr('Cancel before establishment, before the activity date','活動確立時間前取消，且尚未到活動當天'),tr('No deduction','不扣分')],
  [tr('Cancel after establishment, before the activity date','活動確立時間後、活動當天之前取消'),'−3'],
  [tr('Cancel on the activity date, with or without a replacement','活動當天取消，不論是否有人遞補'),'−3'],
  [tr('No-show without cancelling in advance','未事先取消而未出席'),'−10'],
  [tr('Leave early without host approval','未經主辦人同意早退'),tr('−3; no attendance credit','−3，且不取得該場出席加分')],
  [tr('Attend as agreed and meet credit requirements','符合條件並依約出席'),'+1'],
  [tr('The host cancels the entire activity','主辦人取消整場活動'),tr('Other participants: no deduction. A withdrawal penalty already incurred remains.','其他參加者不扣分；已成立的退出扣分仍保留。')]
 ];
 return `<section class="approved-policy"><h3>${tr('Approved scoring table · Next edition','已確認的誠信分數計分表・下一版')}</h3><p class="notice">${tr('This table records the agreed next-edition rules. The current v4 demo still uses +1 / −1 / −5 and does not yet implement the new establishment deadline or early-departure scoring.','這張表記錄已確認的下一版規則。目前 v4 示範計分仍為 +1／−1／−5，尚未套用新的活動確立時間與早退計分。')}</p><table class="integrity-policy-table"><thead><tr><th scope="col">${tr('Situation','情況')}</th><th scope="col">${tr('Score','計分')}</th></tr></thead><tbody>${rows.map(([a,b])=>`<tr><td>${a}</td><td>${b}</td></tr>`).join('')}</tbody></table><ul><li>${tr('If a participant withdraws after establishment or on the activity date and the host consequently cancels the event, that participant keeps the −3 withdrawal penalty; everyone else is not penalized. Cancellation does not add a second penalty.','若玩家於活動確立後或活動當天退出，導致主辦人必須取消整場活動，該玩家仍扣 3 分，其他人不扣分；不因整場取消再加扣一次。')}</li><li>${tr('Cancelled activities remain in the history of everyone who ever registered, including those who withdrew. Registration history is not proof of attendance and does not grant attendance credit.','取消的活動仍保留於所有曾報名者的活動紀錄，包括已退出者。報名紀錄不代表實際出席，也不會因此獲得出席加分。')}</li><li>${tr('Start at 100; scores may exceed 100.','起始 100 分，可超過 100 分。')}</li><li>${tr('Same-day cancellation is −3 even before establishment. One withdrawal does not receive multiple penalties.','活動當天取消，即使尚未到活動確立時間也扣 3 分；同一次退出不重複扣分。')}</li><li>${tr('The host marks attendance and early departure; the system calculates scores. Attendance credit requires self and host confirmation, at least two actual attendees, and is limited to +1 per day. Hosts cannot earn credit from their own activities.','主辦人標記出席與早退，系統計分。出席加分需本人與主辦人確認，且至少兩人實際出席；每日最多 +1。主辦人不能從自己的活動加分。')}</li><li>${tr('No-show penalties have a 48-hour appeal window. Unauthorized early-departure decisions can also be appealed. Recent attendance covers the last five eligible activities.','未到扣分提供 48 小時申訴期限；未經同意早退的判定也可申訴。近期出席率計算最近 5 場符合計分資格的活動。')}</li></ul></section>`;
}
rulesV3=function(){rulesBeforeApprovedTable();const body=$('#modal .modal-body')||$('#modal');body.insertAdjacentHTML('afterbegin',approvedIntegrityTable());translatePage()};

// Preserve participation history independently of the active roster.
function rememberParticipants(e){e.registeredHistory=e.registeredHistory||[];const ids=new Set(e.registeredHistory.map(p=>p.id));for(const p of [...e.participants,{id:e.host,role:'Host'},...S.ledger.filter(l=>l.event===e.id).map(l=>({id:l.user,role:'Recorded'})),...(e.roleHistory||[])]){if(p.id&&!ids.has(p.id)){e.registeredHistory.push({id:p.id,role:p.role||p.from||'Recorded'});ids.add(p.id)}}}
function rememberAllParticipants(){S.events.forEach(rememberParticipants)}
const historyRenderPrevious=render;
render=function(){rememberAllParticipants();historyRenderPrevious();save()};
document.addEventListener('click',rememberAllParticipants,true);
document.addEventListener('submit',rememberAllParticipants,true);
const cancellationBeforeHistory=cancelEvent;
cancelEvent=function(e,reason){rememberParticipants(e);if(e.status==='open'){e.cancelledAt=S.now;e.cancellationNote=reason;}cancellationBeforeHistory(e,reason);save()};
// V4 still uses its legacy score amounts. A confirmed withdrawal is no longer
// erased by a later whole-event cancellation. The approved next-edition table
// explicitly displays the upcoming −3 rule rather than claiming it is active.
refundCancelledPenalties=function(e){for(const l of S.ledger.filter(l=>l.event===e.id&&l.delta<0&&!['void','unverified'].includes(l.state))){if(l.type==='late'&&l.state==='confirmed')continue;if(l.state==='confirmed')user(l.user).score-=l.delta;l.state='void'}};
activities=function(){if(!user())return `<div class="empty"><h2>${tr('Sign in to view your activities','登入以查看你的活動')}</h2><button class="btn" data-action="auth">${tr('Sign in','登入')}</button></div>`;rememberAllParticipants();const tab=['Hosted','Booked'].includes(V.tab)?V.tab:'History';const remembered=e=>e.registeredHistory.some(p=>p.id===S.user);const list=S.events.filter(e=>tab==='Hosted'?e.host===S.user:tab==='Booked'?e.status==='open'&&(membership(e)||e.host===S.user):remembered(e)&&(e.status!=='open'||(!membership(e)&&e.host!==S.user))).sort((a,b)=>tab==='History'?Date.parse(b.start)-Date.parse(a.start):Date.parse(a.start)-Date.parse(b.start));return `<h1>${tr('My activities','我的活動')}</h1><div class="subtabs">${[['Hosted',tr('I’m hosting','我發起的活動')],['Booked',tr('Upcoming','即將參加')],['History',tr('Activity history','活動紀錄')]].map(([id,label])=>`<button data-action="activity-tab" data-value="${id}" class="${tab===id?'active':''}">${label}</button>`).join('')}</div>${tab==='History'?`<p class="muted">${tr('Completed, cancelled and withdrawn activities stay here. A registration record is not attendance.','已完成、已取消與已退出的活動都保留在這裡；曾報名不代表實際出席。')}</p>`:''}${list.length?`<div class="cards">${list.map(e=>{let h=activityCard(e);if(tab==='History'){const label=e.status==='cancelled'?tr('Cancelled · Registration retained','活動已取消・報名紀錄保留'):!membership(e)?tr('Withdrawn · Registration retained','已退出・報名紀錄保留'):tr('Completed','已完成');h=h.replace('<div class="card-body">',`<div class="card-body"><p class="history-registration">${label}</p>`)}return h}).join('')}</div>`:`<div class="empty">${tr('No activities in this section yet.','目前沒有這類活動。')}</div>`}`};

ic cancellation.','未回覆則自動取消。')}</p>${e.host===S.user?button6('proceed6',tr('Go ahead with fewer players','人數不足仍照常舉行'))+button6('cancel6',tr('Cancel activity','取消活動')):button6('host-view6',tr('Demo: view as host','示範：切換主辦人視角'))}</section>`:''}${e.low6==='proceed'&&e.status==='open'?`<div class="notice green">${tr('The host confirmed this activity will go ahead, even below the minimum.','主辦人已確認，即使人數不足仍照常舉行。')}</div>`:''}${p?.role==='Waitlist'?`<section class="notice"><b>${tr('On the waitlist · No obligation to attend yet','候補中・尚無到場義務')}</b><p>${tr('Only an accepted invitation changes you to a player. Declining or missing an invitation is not a failed commitment.','接受邀請後才成為正式玩家；拒絕或錯過邀請不列入失約。')}</p>${pendingOffer6(e)&&e.offer6.ids.includes(S.user)&&!e.offer6.declined.includes(S.user)?`<p>${tr('Invitation expires','邀請截止')} ${fmt(e.offer6.until,e.zone,{timeStyle:'medium'})}</p>${button6('accept6',tr('Accept player spot','接受正式名額'),'','btn')}${button6('reject6',tr('Decline this invitation','婉拒本次邀請'))}`:''}</section>`:''}${p?.team&&datePart(S.now,e.zone)===datePart(e.start,e.zone)&&e.status==='open'?tshirt6(p.team):''}${canEvaluate6(e)?`<section class="notice green"><b>${tr('Attendance & player ratings are open','出席與玩家評分已開放')}</b><p>${tr('Editable until','可以修改至')} ${fmt(cutoff6(e),e.zone,{dateStyle:'short',timeStyle:'short'})}</p>${button6('evaluate6',tr('Attendance & player ratings','填寫出席與玩家評分'),'','btn')}</section>`:''}${e.handoff?`<div class="notice">${tr('A new host is needed by','徵求接任主辦，截止於')} ${fmt(e.handoff.deadline,e.zone,{dateStyle:'short',timeStyle:'short'})}${p&&e.host!==S.user?button6('take-host6',tr('Volunteer to host','自願接任主辦')):''}</div>`:''}<div class="detail-tabs6">${button6('info-tab6',tr('Activity details','活動資訊'))}${button6('chat-tab6',tr('Activity chat','活動聊天室')+(unread>0?` <span class="unread5">${unread}</span>`:''))}</div><div class="detail-layout6"><section class="detail-info6 ${V.detailTab==='chat'?'mobile-hide6':''}"><div class="panel"><div class="status5"><span class="pill ${!ready(e)?'shortfall':'green'}">${status6(e)}</span><span class="pill">${enrollment6(e)}</span></div><h3>${tr('When & where','時間與地點')}</h3><p>${when(e)} — ${fmt(finish6(e),e.zone,{timeStyle:'short'})}</p><p>${esc(e.location)} · ${esc(e.city)}</p><div class="map6"><span style="left:${e.pin?.[0]||52}%;top:${e.pin?.[1]||43}%">📍</span><small>${tr('Meeting point preview · Not a live map','集合點示範・尚未連接地圖服務')}</small></div><p>${esc(e.note||'')}</p><div class="facts"><div><small>${tr('Required skill level','參與者技能最低等級')}</small><b>${e.skill==='Any'?tr('Any level','不限等級'):tr(e.skill,{Beginner:'初學',Advanced:'進階以上',Expert:'高手'}[e.skill])}</b></div><div><small>${tr('Reliability threshold','履約分數門檻')}</small><b>${e.threshold||tr('No restriction','不限')}</b></div><div><small>${tr('Venue estimate','預估場地金額')}</small><b>${e.cost?money(e.cost,e):tr('Free','免費')}</b><small>${e.costType==='total'?tr('Shared by active players; current estimate ','有進行活動的玩家分攤，目前每人約 ')+money(e.cost/Math.max(1,players(e).length),e):e.costType==='person'?tr('Each player pays their own costs','各玩家自付相關費用'):''}</small></div><div><small>${tr('Admission per person','每人入場費')}</small><b>${money(e.entry||0,e)}</b><small>${tr('Also applies to spectators. Pay on site.','觀賽者也適用，現場自行付款。')}</small></div></div><p>${tr('Equipment','裝備')}：${e.equipment==='Provided by host'?tr('Provided by host','主辦方提供'):tr('Bring your own','請自備')}</p>${button6('rules6',tr('Read activity & scoring rules','查看活動與評分規則'))}</div><section class="panel"><h3>${tr('Participants','參加人員')}</h3>${roster6(e)}</section>${p&&canJoin?`<section class="panel">${button6('leave6',e.host===S.user?tr('Transfer hosting / leave','交接主辦／退出'):tr('Cancel registration','取消報名'))}${e.host===S.user?button6('cancel6',tr('Cancel the whole activity','取消整場活動')):''}</section>`:''}${e.host===S.user&&e.mode6==='popup'&&e.status==='open'?button6('end-popup6',tr('End this pop-up now','現在結束即興活動')):''}</section><aside class="panel chat6 ${V.detailTab!=='chat'?'mobile-hide6':''}"><h3>${tr('Activity chat','活動聊天室')}</h3>${p?`<div class="chat-messages6">${e.messages.map(m=>`<div><b>${esc(displayName5(user(m.id)))}</b><p>${esc(m.text)}</p></div>`).join('')}</div><form id="chat6"><input name="text" aria-label="${tr('Message','訊息')}" placeholder="${tr('Say something…','說點什麼…')}" required maxlength="1000"><button class="btn">${icon('send')}</button></form>${button6('demo-chat6',tr('Demo new message','示範收到新訊息'),'','textbtn')}`:`<p>${tr('Join to use the activity chat.','報名後可使用活動聊天室。')}</p>`}</aside></div>`};
function ruleHTML6(){return `<p>${tr('Scheduled and pop-up activities work differently. All times use the activity’s local time zone.','預約活動與即興活動規則不同，所有時間均以活動所在地時區為準。')}</p><table class="rules-table6"><thead><tr><th>${tr('Situation','情況')}</th><th>${tr('Rule','規則')}</th></tr></thead><tbody>${[
 [tr('Advance scheduled activity','事前發起的預約活動'),tr('Establishment defaults to midnight at the start of the activity date. The host may move it earlier.','預設在活動當天 00:00 確立，可由主辦人提前。')],
 [tr('Same-day scheduled activity','當天發起的預約活動'),tr('With a minimum: create at least 2 hours ahead; establish 1 hour before start. Choose the low-attendance policy in advance.','有最低人數時至少提前 2 小時建立，開始前 1 小時確立；建立時預選人數不足的處理方式。')],
 [tr('Below minimum','人數不足'),tr('Host chooses go ahead or cancel by 1 hour before start. No reply defaults to cancel; the selected policy handles later shortfalls.','主辦人在開始前 1 小時前選擇照常或取消；未回覆預設取消。之後缺人依主辦人選定方式處理。')],
 [tr('Waitlist invitation','候補邀請'),tr('All eligible waitlisted members are invited. First acceptance wins. Reserved for up to 30 minutes, never past start. No acceptance means no attendance obligation.','邀請所有合格候補，最先接受者取得名額；空位保留最多 30 分鐘，不超過開始時間。未接受者不須到場、不計履約。')],
 [tr('Pop-up activity','即興活動'),tr('Starts today within 2 hours; no minimum or skill/score threshold. Join during the activity. Without an end time, delists 2 hours after start. No reliability or peer-star scoring.','當天 2 小時內開始，不限最低人數、技能與履約門檻；進行中可加入。未填結束時間則開始 2 小時後下架，不計履約及星等。')],
 [tr('Cancel before establishment','活動確立前取消'),tr('Excluded from numerator, denominator and recent results.','不列入分子、分母或近期紀錄。')],
 [tr('Cancel after establishment / late / unauthorized early departure','確立後取消／遲到／未經同意早退'),tr('Counts as an unsuccessful commitment, even if someone replaces you.','列為一次未成功履約，即使有人遞補也相同。')],
 [tr('No-show without cancellation','沒有取消而未出席'),tr('One unsuccessful commitment, plus a 20-point deduction. Each later eligible success reduces each active deduction by 2; repeated no-shows stack.','列為未成功履約，另扣 20 點。每完成一場合格履約，每筆額外扣減各恢復 2 點；多次未到會疊加。')],
 [tr('Host cancels the whole activity','主辦人取消整場活動'),tr('Others receive no failed-attendance record. A withdrawal already recorded after establishment stays. Everyone keeps the activity in history.','其他人不計失約；已成立的確立後取消紀錄保留。所有曾報名者仍保留活動紀錄。')],
 [tr('Reliability','履約分數'),tr('Last 20 eligible results: success percentage minus active no-show deductions, minimum 0. Lifetime completions are shown separately. Your own hosted successes do not raise your score.','最近 20 場合格紀錄的成功比例，減去未恢復的未到扣減，最低 0；累計完成次數另外顯示。自己主辦的成功活動不提高自己的分數。')],
 [tr('Attendance and stars','出席與星等'),tr('Draft from start until midnight after the activity’s end date. Host marks attendance; participants may report the host absent. Unverifiable conflicting records are excluded. One latest finalized rating per reviewer and player.','開始後可填寫，至活動結束當日的午夜結算。主辦人標記出席，其他參加者可回報主辦未到；矛盾且無法確認者不納統計。每位評分者對同一玩家只保留最新有效星等。')]
 ].map(([a,b])=>`<tr><th>${a}</th><td>${b}</td></tr>`).join('')}</tbody></table>`}
rulesV3=()=>modal(tr('Activity & reliability rules','活動誠信評分規則說明'),ruleHTML6());

function scoreRules7(){return `<section class="rules-section7"><h2>${tr('Reliability rules — Scheduled','履約分數規則說明—預約活動')}</h2><h3>${tr('How scores are shown','分數如何呈現')}</h3><ul><li>${tr('Fulfilled activities: activities you attended on time and completed.','履約活動次數：準時出席並完成活動的次數。')}</li><li>${tr('Total activities: counted commitments, including late arrival, early departure, cancellation after establishment and absence.','參加活動總數：納入履約計算的活動次數，包含確立後退出、遲到早退及未出席。')}</li><li>${tr('Lifetime record = fulfilled activities / total activities, e.g. 33/36.','累計紀錄＝履約活動次數／參加活動總數，例如 33／36。')}</li><li>${tr('Recent reliability = fulfilled / total over the latest 20 counted activities × 100, less outstanding no-show deductions, minimum 0.','近期履約分數＝最近最多 20 場的履約活動次數 ÷ 同期參加活動總數 × 100，再減去尚未恢復的未到額外扣減，最低為 0。')}</li><li>${tr('Members without a history are labelled “No history”.','尚無紀錄時顯示「尚無紀錄」。')}</li></ul><table class="rules-table6"><thead><tr><th>${tr('Situation','情況')}</th><th>${tr('Rule','規則')}</th></tr></thead><tbody>${SCORE_RULES7.map(([en,zh,a,b])=>`<tr><th>${tr(en,zh)}</th><td>${tr(a,b)}</td></tr>`).join('')}</tbody></table><p>${tr('At least two people must actually participate for a successful commitment. Players, referees and coaches follow these rules.','成功履約至少須有兩人實際參與。正式玩家、裁判及教練均適用上述規則。')}</p><h3>${tr('Attendance marking','出席標記')}</h3><ul><li>${tr('From the start, hosts mark the other committed participants.','活動開始後，由主辦人標記其他承諾到場者。')}</li><li>${tr('Other committed participants may report the host absent; activities with three or more people require two reports.','其他承諾到場的參加者可回報主辦人未到；三人以上的活動至少需兩人回報。')}</li><li>${tr('Edit until midnight after the activity’s end date, then results settle.','可修改至活動結束當日午夜，之後結算。')}</li></ul></section>`}
